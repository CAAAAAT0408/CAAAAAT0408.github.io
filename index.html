<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동화 도구 모음_v1.1</title>
<style>
:root{--bg:#eef1f6;--ink:#1b2335;--sub:#5f6b7d;--line:#e2e6ee;--accent:#2457c5;--accent-d:#1b47a3;--soft:#f4f7fc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Malgun Gothic","맑은 고딕","Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#17213a 0%,#24407a 100%);color:#fff;padding:34px 20px 30px;text-align:center}
header h1{margin:0;font-size:24px;letter-spacing:-.3px}
header h1 .ver{font-size:1em!important;margin-left:0!important;font-weight:bold!important;opacity:.85!important}
header p{margin:8px 0 0;color:#c9d4ea;font-size:13.5px}
main{max-width:600px;margin:0 auto;padding:26px 16px 50px}
.tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px;margin:0 0 16px;box-shadow:0 4px 16px rgba(23,33,58,.06);transition:box-shadow .15s,transform .15s}
.tool:hover{box-shadow:0 8px 24px rgba(23,33,58,.10);transform:translateY(-1px)}
.tool h2{margin:0 0 6px;font-size:19px;letter-spacing:-.2px}
.tool h2 .v{color:var(--accent)}
.tool .desc{margin:0 0 16px;color:var(--sub);font-size:14px}
.act{display:flex;align-items:center;gap:16px}
.btn{flex:1;display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:bold;font-size:15px;padding:11px 16px;border-radius:11px}
.btn:hover{background:var(--accent-d)}
.tog{color:var(--accent);font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none}
.tog:before{content:"▸ "}
.tool.open .tog:before{content:"▾ "}
.log{display:none;margin:16px 0 0;background:var(--soft);border-radius:12px;padding:12px 16px;font-size:13.5px}
.tool.open .log{display:block}
.log ul{margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-bottom:1px solid #e5eaf3}
.log li:last-child{border-bottom:none}
.log b{color:var(--accent);margin-right:8px}
.log .d{color:var(--sub);font-size:12.5px;margin-right:8px}
.log li ul{margin:4px 0 0;padding-left:18px;list-style:disc}
.log li ul li{border:none;padding:1px 0}
.hist{margin-top:8px;color:var(--sub);font-size:12.5px}
.hist summary{cursor:pointer;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary:before{content:"▸ "}
.hist[open] summary:before{content:"▾ "}
.hist ul{margin-top:4px}
footer{max-width:600px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:12.5px;text-align:center}
footer .tog{display:inline-block}
footer .log{text-align:left}
footer.open .log{display:block}
</style>
</head>
<body>
<header><h1>자동화 도구 모음<span class="ver" style="font-size:.6em;font-weight:normal;opacity:.75;margin-left:6px">_v1.1</span></h1><p>하고 싶은 작업을 골라 「열기」를 누르세요 · 「업데이트 이력」을 펼치면 버전마다 무엇이 바뀌었는지 보입니다</p></header>
<main id="list"></main>
<footer id="hubfoot">버전은 최초 1.0, 수정 1회마다 0.1 씩 올립니다 · <span class="tog" data-key="hub">이 페이지 업데이트 이력</span><div class="log" id="log-hub"></div></footer>
<script id="versions" type="application/json">{"pages": {"budget": {"name": "판관비 예산안 자동작성(연간 예산안)", "version": "1.0", "changelog": [{"version": "1.0", "date": "2026-11-05", "changes": ["버전 관리 시작 — 현재 기능 기준(1.0)"]}], "history": [{"date": "2026-11-03", "note": "판관비 예산안 자동작성 도구 첫 버전(PC 판)"}, {"date": "2026-11-03", "note": "웹판(GitHub Pages) 추가 — 브라우저 안에서 계산·회사 양식 작성"}, {"date": "2026-11-03", "note": "웹판: 예시 3개를 '저장한 현장' 목록에서 바로 불러오기"}, {"date": "2026-11-03", "note": "다른 PC(E:/F:)에서도 그대로 — 저장한 현장 경로 드라이브 보정, 깃허브 올리기.bat"}, {"date": "2026-11-03", "note": "특별공급 세대수 칸 제거(갑지 총세대수로 판단), 결과표 월별 칸에 계산 수식 표시"}, {"date": "2026-11-04", "note": "같은 세목(식대·유류비/숙박비·통신요금·전기료)을 한 줄로 합침 — 산출근거에 구간별 내역, 합계는 통합 금액"}]}, "jichul": {"name": "지출계획서 자동작성", "version": "1.0", "changelog": [{"version": "1.0", "date": "2026-11-05", "changes": ["버전 관리 시작 — 현재 기능 기준(1.0)"]}], "history": [{"date": "2026-11-03", "note": "지출계획서 자동작성 추가 — 같은 기준단가로 3개월 지출계획서(오픈·운영·입주·분양사무실), PC 판·웹판"}, {"date": "2026-11-04", "note": "현장 구분을 견본주택 오픈 / 견본주택 운영으로 분리 — 운영은 오픈 일정 없이 운영 기준"}, {"date": "2026-11-05", "note": "과거 지출계획서 75건(18개 현장)으로 재현 검증, 결과 엑셀·개선 후보 정리"}]}, "overview": {"name": "분양개요 자동작성", "version": "1.0", "changelog": [{"version": "1.0", "date": "2026-11-05", "changes": ["버전 관리 시작 — 현재 기능 기준(1.0)"]}], "history": [{"date": "2026-10-16", "note": "분양개요 자동작성: 웹 버전(GitHub Pages) 추가"}, {"date": "2026-10-18", "note": "납부조건 양식·그림 자르기·견본주택 위치도·보고자료 시트"}, {"date": "2026-10-18", "note": "웹 버전: 분양 홈페이지 그림 자동 모으기(Cloudflare 중계)"}, {"date": "2026-10-23", "note": "맨 앞에 열이 더 있는 양식 지원, 새 보고자료 시트 지워짐 수정"}]}, "contract": {"name": "계약서 자동작성(공급계약서·추가선택품목)", "version": "1.0", "changelog": [{"version": "1.0", "date": "2026-11-05", "changes": ["버전 관리 시작 — 현재 기능 기준(1.0)"]}], "history": [{"date": "2026-10-02", "note": "공급계약서 자동작성 도구(브라우저 버전 + 사내 서버 버전)"}, {"date": "2026-10-02", "note": "추가선택품목 계약서(엑셀) 탭 추가"}, {"date": "2026-10-06", "note": "예전 양식 공고·샘플 지원, 수정 표시가 남은 HWP 읽기 오류 수정"}, {"date": "2026-10-06", "note": "추가선택품목: 모집공고 기준으로 품목 표를 다시 짜기"}, {"date": "2026-10-06", "note": "결과 파일 이름: 공고 파일 이름 앞에 기호·날짜가 붙어도 현장명을 찾기"}]}, "notice": {"name": "입주자모집공고 자동작성", "version": "1.6", "changelog": [{"version": "1.6", "date": "2026-11-06", "changes": ["그림 설계개요(화성비봉 도면 PDF) 판독 보강: 숫자 뒤 깨진 단위(84.992k) 무시, 'B4B㎡형'→84B, 유형 뒤 건립비율 칸, 라벨 없는 합계 줄", "세대수 칸이 빠진 유형은 건립비율×합계로(합이 맞을 때만), 합계 줄로 한 유형의 마지막 자리 오독 보정, 계약면적 못 읽은 유형 안내", "면적표를 못 읽어도 글자 인식한 개요 항목(사업명·대지위치·규모)은 살림, 도면 글자층의 사업명으로 보정", "시군구 오독('회성시')은 택지지구 이름(비봉→화성시)으로 바로잡음, 정비사업 판정은 표지·도면목록의 사업명 줄만"]}, {"version": "1.5", "date": "2026-11-06", "changes": ["이천중리 1차 동호배치도 양식(층 라벨이 숫자만, '타입' 라벨 없음, 동 이름 줄이 아래쪽) 읽기", "공급대상 표에서 유형 줄을 지울 때 병합 칸·표 높이도 줄임(남은 줄이 길어지던 것)", "대지지분: 세대당 값이 아닌 칸은 버리고 「대지지분 안분표」 시트에서 읽음", "택지 추정: 66만㎡ 미만 지구(이천 중리)는 대규모 택지로 보지 않음, 확인 안내 문구", "비교 도구: 다른 공고 표가 섞인 최종 파일에서 공급금액 표 고르기"]}, {"version": "1.4", "date": "2026-11-05", "changes": ["다른 현장 4곳 더 실험(오산 서2·평택고덕 1차·인천검단 2차·과천 S8) + 3차(A66) 설계개요: 정림 세로 띠 면적표의 붙은 머리글, 도면 이름표를 설계개요 유형 이름에 맞춤(101A→101), 그림 설계개요 소수점 빠짐·D/8 오독·숫자만 유형·세대수 합계 채움, 엑셀 두 칸 머리글·빈 줄·두 줄 동별개요, 시도 없는 대지위치(택지지구로 추정)", "공급금액 표: 세대가 없는 층구분 줄 지우기, 같은 주택형(84A·84A-1) 겹침 정리, 동호배치도 엑셀로 「동(라인)」 칸 채우기(도면 PDF·동호배치도 추가 버튼)"]}, {"version": "1.3", "date": "2026-11-05", "changes": ["다른 현장 6곳(이천1차·화성비봉·김포북변·오산세교1차·화성태안1·2차) 실험 반영: 도면 동별 면적표 새 형식 5가지(세로 띠·유형 줄·묶음 동·층당 합계 등), 나뉜 도면 PDF 여러 개 올리기, 그림 설계개요 방향·배율 자동, 숫자만인 유형(72·84)·대지지분 시트, 공공택지 추정 보정"]}, {"version": "1.2", "date": "2026-11-05", "changes": ["그림으로 된 설계개요 쪽 글자 인식 표 판독(전용·주거공용·공급·기타공용·계약면적), 동별 면적표 「면적 X n EA」 형식(이천중리) 지원, 거주의무 기본값 없음+확인 안내"]}, {"version": "1.1", "date": "2026-11-05", "changes": ["청약홈 최신 샘플 자동 선택 + 최근 현장 공고안(양식) 반영 + 설계도서(개요 엑셀·.xls·도면 PDF)로 동호수 배치까지 읽기 + 지역·택지 구분 설계개요에서 추정"]}, {"version": "1.0", "date": "2026-11-05", "changes": ["최초 작성 — 초안 만들기(설계개요·지역 선택) / 부서 의견 반영 / 청약홈 샘플 비교"]}, {"version": "1.1", "date": "2026-11-05", "changes": ["최초 작성"]}], "history": []}, "hub": {"name": "자동화 도구 모음", "version": "1.1", "changelog": [{"version": "1.1", "date": "2026-11-05", "changes": ["입주자모집공고 자동작성 추가(도구 5개)"]}, {"version": "1.0", "date": "2026-11-05", "changes": ["자동화 도구 모음 페이지 첫 버전 — 도구 4개 바로가기(웹판), 이름 옆 버전, 업데이트 이력"]}], "history": []}}}</script>
<script>
const TOOLS = [
  {key: 'budget', repo: 'pangwanbi-budget', name: '판관비 예산안 자동작성', desc: '현장 조건을 넣으면 그 해 기준안대로 연간 판관비 예산안을 계산해 회사 「사업비 예산편성 양식」 엑셀로 만듭니다.',
   open: 'https://caaaaat0408.github.io/pangwanbi-budget/'},
  {key: 'jichul', repo: 'pangwanbi-budget', name: '지출계획서 자동작성', desc: '3개월 선급금 지출계획서(견본주택 오픈·운영 / 입주 / 분양사무실)를 예산안과 같은 기준단가로 만듭니다.',
   open: 'https://caaaaat0408.github.io/pangwanbi-budget/jichul/'},
  {key: 'overview', repo: 'bunyang-overview', name: '분양개요 자동작성', desc: '입주자모집공고(PDF)와 이전 현장의 분양개요 양식으로 새 분양개요·청약결과 엑셀을 만듭니다.',
   open: 'https://caaaaat0408.github.io/bunyang-overview/'},
  {key: 'contract', repo: 'contract-builder', name: '계약서 자동작성', desc: '이전 현장 계약서와 새 모집공고(hwp)로 공급계약서·추가선택품목 계약서와 변경내역을 만듭니다.',
   open: 'https://caaaaat0408.github.io/contract-builder/'},
  {key: 'notice', repo: 'notice-builder', name: '입주자모집공고 자동작성', desc: '청약홈 샘플·자사 최근 공고안을 기준으로 설계개요를 읽어 설계 부분을 채운 입주자모집공고 초안(한글)을 만들고, 부서 회신을 현재안에 합칩니다.',
   open: 'https://caaaaat0408.github.io/notice-builder/'},
];
const HUB_REPO = 'CAAAAAT0408.github.io';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let DATA = {};
try { DATA = JSON.parse(document.getElementById('versions').textContent || '{}').pages || {}; } catch (e) { DATA = {}; }
const ver = k => (DATA[k] && DATA[k].version) || '1.0';
function logHtml(p) {
  if (!p) return '<ul><li>업데이트 이력이 없습니다.</li></ul>';
  const items = (p.changelog || []).map(c => `<li><b>v${esc(c.version)}</b><span class="d">${esc(c.date)}</span>${(c.changes || []).length > 1 ? '<ul>' + c.changes.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : esc((c.changes || [])[0] || '')}</li>`).join('');
  const hist = (p.history || []).map(h => `<li>${esc(h.date)} · ${esc(h.note)}</li>`).join('');
  return `<ul>${items || '<li>업데이트 이력이 없습니다.</li>'}</ul>` + (hist ? `<details class="hist"><summary>1.0 이전 변경 이력 (${p.history.length}건)</summary><ul>${hist}</ul></details>` : '');
}
function card(t) {
  return `<section class="tool" id="tool-${t.key}"><h2>${esc(t.name)}<span class="v">_v${esc(ver(t.key))}</span></h2><p class="desc">${esc(t.desc)}</p>`
    + `<div class="act"><a class="btn" href="${t.open}" target="_blank" rel="noopener">열기</a><span class="tog" data-key="${t.key}">업데이트 이력</span></div>`
    + `<div class="log" id="log-${t.key}">${logHtml(DATA[t.key])}</div></section>`;
}
function render() {
  document.getElementById('list').innerHTML = TOOLS.map(card).join('');
  document.getElementById('log-hub').innerHTML = logHtml(DATA.hub);
}
render();
document.addEventListener('click', e => {
  const t = e.target.closest('.tog');
  if (t) (t.closest('.tool') || t.closest('footer')).classList.toggle('open');
});
// 올려 둔 저장소의 version.json 이 더 새 버전이면 그것으로 바꿔 보여줌(인터넷이 안 되거나 아직 안 올렸으면 페이지에 든 값 그대로)
const repos = {};
for (const t of TOOLS) (repos[t.repo] = repos[t.repo] || []).push(t.key);
repos[HUB_REPO] = ['hub'];
for (const [repo, keys] of Object.entries(repos)) {
  fetch(`https://raw.githubusercontent.com/CAAAAAT0408/${repo}/main/version.json?t=${Date.now()}`, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.pages) return;
    let changed = false;
    for (const k of keys) {
      const p = j.pages[k];
      if (p && (!DATA[k] || parseFloat(p.version) > parseFloat(DATA[k].version))) { DATA[k] = p; changed = true; }
    }
    if (changed) render();
  }).catch(() => {});
}
</script>
</body>
</html>
